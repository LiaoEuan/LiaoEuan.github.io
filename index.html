<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Academic CV of Yuan Liao, researcher in auditory brain-computer interfaces and EEG decoding.">
  <title>Yuan Liao | Academic CV</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17211c;
      --muted: #5d6761;
      --paper: #ffffff;
      --canvas: #eef1ef;
      --accent: #12664f;
      --line: #d6dcd8;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      background: var(--canvas);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    header {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 14px clamp(18px, 4vw, 48px);
      background: var(--paper);
      border-bottom: 1px solid var(--line);
    }

    .identity { min-width: 0; }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0;
    }

    p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    .button {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 14px;
      border: 1px solid var(--accent);
      border-radius: 6px;
      font-size: 14px;
      font-weight: 650;
    }

    .button.primary {
      background: var(--accent);
      color: #fff;
    }

    main {
      height: calc(100vh - 76px);
      padding: 18px clamp(12px, 3vw, 32px) 24px;
    }

    iframe {
      width: 100%;
      height: 100%;
      display: block;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 6px;
    }

    .fallback { display: none; }

    @media (max-width: 680px) {
      header {
        min-height: 128px;
        align-items: flex-start;
        flex-direction: column;
        gap: 12px;
      }

      nav { width: 100%; }
      .button { flex: 1; }
      main { height: calc(100vh - 128px); padding: 10px; }
    }

    @media (max-width: 480px) {
      iframe { display: none; }
      main {
        height: auto;
        min-height: calc(100vh - 128px);
        display: grid;
        place-items: center;
      }
      .fallback {
        display: block;
        max-width: 320px;
        text-align: center;
        line-height: 1.6;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="identity">
      <h1>Yuan Liao</h1>
      <p>Auditory BCI · EEG decoding · Wearable neurotechnology</p>
    </div>
    <nav aria-label="CV links">
      <a class="button" href="https://scholar.google.com.hk/citations?user=qMoPOPoAAAAJ&amp;hl=zh-CN">Scholar</a>
      <a class="button primary" href="Yuan_Liao_CV.pdf?v=20260920-full" download>Download PDF</a>
    </nav>
  </header>
  <main>
    <iframe src="Yuan_Liao_CV.pdf?v=20260920-full#view=FitH" title="Yuan Liao academic CV"></iframe>
    <p class="fallback">Your browser cannot display the embedded PDF. <a href="Yuan_Liao_CV.pdf?v=20260920-full">Open the CV directly</a>.</p>
  </main>
</body>
</html>
